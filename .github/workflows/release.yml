name: Release

# NOTE: the repository default branch is currently `master`. `changeset publish`
# only runs when changesets are present, so listing both branches is safe; after
# renaming the default branch to `main` you can drop `master`.
on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to a version that supports OIDC
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Note: NO NPM_TOKEN — OIDC handles auth (Trusted Publishing)
